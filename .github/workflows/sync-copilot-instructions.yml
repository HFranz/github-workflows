name: Sync Copilot Instructions

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      REPOS: ${{ vars.COPILOT_REPOS }}

    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4

      - name: Install GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y gh

      - name: Sync files (1:1 copy)
        run: |
          set -e

          SOURCE_DIR="$GITHUB_WORKSPACE"

          CP_SRC="$SOURCE_DIR/.github/copilot-instructions.md"
          WP_SRC="$SOURCE_DIR/.github/instructions/wordpress.instructions.md"

          if [ ! -f "$CP_SRC" ]; then
            echo "ERROR: missing $CP_SRC"
            exit 1
          fi

          if [ ! -f "$WP_SRC" ]; then
            echo "ERROR: missing $WP_SRC"
            exit 1
          fi

          IFS=',' read -ra REPO_ARRAY <<< "$REPOS"

          for repo in "${REPO_ARRAY[@]}"; do
            repo=$(echo "$repo" | xargs)
            echo "Processing $repo"

            git clone "https://x-access-token:${GH_TOKEN}@github.com/$repo.git"
            dir=$(basename "$repo")
            cd "$dir"

            git checkout main
            git pull origin main

            # ensure target structure
            mkdir -p .github/instructions

            # =========================
            # COPY FILES 1:1
            # =========================

            cp "$CP_SRC" .github/copilot-instructions.md
            cp "$WP_SRC" .github/instructions/wordpress.instructions.md

            git add .github/copilot-instructions.md
            git add .github/instructions/wordpress.instructions.md

            if git diff --cached --quiet; then
              echo "No changes in $repo"
              cd ..
              rm -rf "$dir"
              continue
            fi

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            git commit -m "Sync instructions"
            git push origin main

            cd ..
            rm -rf "$dir"
          done
