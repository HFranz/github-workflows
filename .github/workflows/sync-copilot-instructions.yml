name: Sync Copilot Instructions

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      REPOS: ${{ vars.COPILOT_REPOS }}

    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4

      - name: Install GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y gh

      - name: Sync Copilot Instructions (direct push)
        run: |
          set -e

          if [ -z "$REPOS" ]; then
            echo "COPILOT_REPOS is empty"
            exit 1
          fi

          SOURCE_DIR="$GITHUB_WORKSPACE"

          if [ ! -f "$SOURCE_DIR/wordpress.instructions.md" ]; then
            echo "ERROR: wordpress.instructions.md not found in source repo"
            exit 1
          fi

          if [ ! -f "$SOURCE_DIR/.github/copilot-instructions.md" ]; then
            echo "ERROR: .github/copilot-instructions.md not found in source repo"
            exit 1
          fi

          CONTENT=$(cat "$SOURCE_DIR/.github/copilot-instructions.md")
          WP=$(cat "$SOURCE_DIR/.github/instructions/wordpress.instructions.md")

          IFS=',' read -ra REPO_ARRAY <<< "$REPOS"

          for repo in "${REPO_ARRAY[@]}"; do
            repo=$(echo "$repo" | xargs)
            echo "Processing $repo"

            git clone "https://x-access-token:${GH_TOKEN}@github.com/$repo.git"
            dir=$(basename "$repo")
            cd "$dir"

            git checkout main
            git pull origin main

            mkdir -p .github

            # =========================
            # OVERWRITE FINAL FILE
            # =========================

            printf "# Copilot Instructions\n\n%s\n\n---\n\n# WordPress Instructions\n\n%s\n" \
              "$CONTENT" "$WP" > .github/copilot-instructions.md

            git add .github/copilot-instructions.md

            if git diff --cached --quiet; then
              echo "No changes in $repo"
              cd ..
              rm -rf "$dir"
              continue
            fi

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            git commit -m "Sync Copilot + WordPress instructions"
            git push origin main

            cd ..
            rm -rf "$dir"
          done
