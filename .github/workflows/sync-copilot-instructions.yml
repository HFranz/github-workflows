name: Sync Copilot Instructions

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      REPOS: ${{ vars.COPILOT_REPOS }}

    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4

      - name: Install GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y gh

      - name: Sync instructions
        run: |
          set -e

          # =========================
          # CONFIG (single source of truth)
          # =========================
          SOURCE_DIR="$GITHUB_WORKSPACE"

          CP_FILE="$SOURCE_DIR/.github/copilot-instructions.md"
          WP_FILE="$SOURCE_DIR/.github/instructions/wordpress.instructions.md"

          # =========================
          # VALIDATION
          # =========================
          if [ -z "$REPOS" ]; then
            echo "ERROR: COPILOT_REPOS is empty"
            exit 1
          fi

          if [ ! -f "$CP_FILE" ]; then
            echo "ERROR: missing $CP_FILE"
            exit 1
          fi

          if [ ! -f "$WP_FILE" ]; then
            echo "ERROR: missing $WP_FILE"
            exit 1
          fi

          CONTENT=$(cat "$CP_FILE")
          WP=$(cat "$WP_FILE")

          # =========================
          # PROCESS REPOS
          # =========================
          IFS=',' read -ra REPO_ARRAY <<< "$REPOS"

          for repo in "${REPO_ARRAY[@]}"; do
            repo=$(echo "$repo" | xargs)
            echo "Processing $repo"

            git clone "https://x-access-token:${GH_TOKEN}@github.com/$repo.git"
            dir=$(basename "$repo")
            cd "$dir"

            # Always sync latest state
            git checkout main
            git pull origin main

            mkdir -p .github

            # =========================
            # WRITE FINAL FILE (overwrite)
            # =========================
            printf "# Copilot Instructions\n\n%s\n\n---\n\n# WordPress Instructions\n\n%s\n" \
              "$CONTENT" "$WP" > .github/copilot-instructions.md

            git add .github/copilot-instructions.md

            # Skip if nothing changed
            if git diff --cached --quiet; then
              echo "No changes in $repo"
              cd ..
              rm -rf "$dir"
              continue
            fi

            # Commit + push
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            git commit -m "Sync Copilot + WordPress instructions"
            git push origin main

            cd ..
            rm -rf "$dir"
          done
