name: Sync Copilot Instructions

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      REPOS: ${{ vars.COPILOT_REPOS }}

    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4

      - name: Install GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y gh

      - name: Sync Copilot Instructions
        run: |
          set -e

          if [ -z "$REPOS" ]; then
            echo "COPILOT_REPOS is empty"
            exit 1
          fi

          IFS=',' read -ra REPO_ARRAY <<< "$REPOS"

          for repo in "${REPO_ARRAY[@]}"; do
            repo=$(echo "$repo" | xargs)
            echo "Processing $repo"

            git clone "https://x-access-token:${GH_TOKEN}@github.com/$repo.git"
            dir=$(basename "$repo")
            cd "$dir"

            BRANCH="sync/copilot-instructions"

            git checkout -B "$BRANCH"

            mkdir -p .github

            # =========================
            # OVERWRITE / COMPOSE FILE
            # =========================

            CONTENT=$(cat ../.github/copilot-instructions.md 2>/dev/null || true)
            WP=$(cat ../wordpress.instructions.md 2>/dev/null || true)

            printf "# Copilot Instructions\n\n%s\n\n---\n\n# WordPress Instructions\n\n%s\n" \
              "$CONTENT" "$WP" > .github/copilot-instructions.md

            git add .github/copilot-instructions.md

            if git diff --cached --quiet; then
              echo "No changes in $repo"
              cd ..
              rm -rf "$dir"
              continue
            fi

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            git commit -m "Sync Copilot + WordPress instructions"

            git push origin "$BRANCH"

            # =========================
            # PR handling
            # =========================

            PR_NUMBER=$(gh pr list \
              --repo "$repo" \
              --head "$BRANCH" \
              --json number \
              --jq '.[0].number')

            if [ -z "$PR_NUMBER" ]; then
              gh pr create \
                --repo "$repo" \
                --head "$BRANCH" \
                --base main \
                --title "Sync Copilot Instructions" \
                --body "Automated sync of Copilot + WordPress instructions"
            fi

            # =========================
            # AUTO MERGE
            # =========================

            PR_NUMBER=$(gh pr list \
              --repo "$repo" \
              --head "$BRANCH" \
              --json number \
              --jq '.[0].number')

            if [ -n "$PR_NUMBER" ]; then
              gh pr merge "$PR_NUMBER" \
                --repo "$repo" \
                --auto \
                --squash
            fi

            cd ..
            rm -rf "$dir"
          done
