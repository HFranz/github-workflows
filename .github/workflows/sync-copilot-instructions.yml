name: Sync Copilot Instructions

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      REPOS: ${{ vars.COPILOT_REPOS }}

    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4

      - name: Install GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y gh

      - name: Sync Copilot Instructions
        run: |
          set -e

          IFS=',' read -ra REPO_ARRAY <<< "$REPOS"

          for repo in "${REPO_ARRAY[@]}"; do
            repo=$(echo "$repo" | xargs)
            echo "Processing $repo"

            git clone "https://x-access-token:${GH_TOKEN}@github.com/$repo.git"
            dir=$(basename "$repo")
            cd "$dir"

            BRANCH="sync/copilot-instructions"

            git checkout -B "$BRANCH"

            mkdir -p .github
            cp ../.github/copilot-instructions.md .github/copilot-instructions.md

            git add .github/copilot-instructions.md

            if git diff --cached --quiet; then
              echo "No changes in $repo"
              cd ..
              rm -rf "$dir"
              continue
            fi

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            git commit -m "Sync Copilot instructions"
            git push origin "$BRANCH" --force-with-lease

            # PR holen oder erstellen
            PR_NUMBER=$(gh pr list \
              --repo "$repo" \
              --head "$BRANCH" \
              --json number \
              --jq '.[0].number')

            if [ -z "$PR_NUMBER" ]; then
              PR_URL=$(gh pr create \
                --repo "$repo" \
                --head "$BRANCH" \
                --base main \
                --title "Sync Copilot Instructions" \
                --body "Automated sync of .github/copilot-instructions.md")

              PR_NUMBER=$(echo "$PR_URL" | grep -oE '[0-9]+$')
            fi

            echo "PR #$PR_NUMBER"

            # Auto-merge aktivieren
            gh pr merge "$PR_NUMBER" \
              --repo "$repo" \
              --auto \
              --squash

            cd ..
            rm -rf "$dir"
          done
