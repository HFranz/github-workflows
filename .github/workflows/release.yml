name: Release

on:
  workflow_call:
    inputs:
      plugin:
        type: string
        required: true
      main_file:
        type: string
        required: false

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      PLUGIN: ${{ inputs.plugin }}
      MAIN_FILE: ${{ inputs.main_file || inputs.plugin }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Extract version from plugin
        id: version
        shell: bash
        run: |
          VERSION=$(grep -oP '^\s*\*\s*Version:\s*\K[\d.]+' "${MAIN_FILE}.php")

          if [ -z "$VERSION" ]; then
            echo "❌ Version not found in ${MAIN_FILE}.php"
            exit 1
          fi

          echo "Plugin: $PLUGIN"
          echo "Main file: $MAIN_FILE"
          echo "Version: $VERSION"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Update workflow summary
        run: |
          {
            echo "## 🚀 Release"
            echo ""
            echo "- Plugin: **${PLUGIN}**"
            echo "- Main file: **${MAIN_FILE}.php**"
            echo "- Version: **${{ steps.version.outputs.version }}**"
            echo "- Triggered by: @${{ github.actor }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Download latest successful Plugin ZIP Artifact
        uses: dawidd6/action-download-artifact@v11
        with:
          workflow: main.yml
          name: plugin-zip
          path: artifacts
          branch: main
          workflow_conclusion: success

      - name: Prepare release ZIP
        shell: bash
        run: |
          mkdir -p release

          ZIP=$(find artifacts -name "*.zip" -type f | head -n1)

          if [ -z "$ZIP" ]; then
            echo "❌ No ZIP artifact found."
            exit 1
          fi

          mv "$ZIP" "release/${{ steps.version.outputs.version }}.zip"

      - name: Create Git Tag
        shell: bash
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"

          if git rev-parse "${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "Tag already exists."
            exit 0
          fi

          git tag -a "${{ steps.version.outputs.version }}" \
            -m "Release version ${{ steps.version.outputs.version }}"

          git push origin "${{ steps.version.outputs.version }}"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create \
            "${{ steps.version.outputs.version }}" \
            "release/${{ steps.version.outputs.version }}.zip" \
            --latest \
            --verify-tag \
            --generate-notes

      - name: Generate update.json
        shell: bash
        run: |
          cat > release/update.json <<EOF
          {
            "version": "${{ steps.version.outputs.version }}",
            "slug": "${PLUGIN}",
            "package": "https://${{ secrets.PLESK_HOST }}/${PLUGIN}/${{ steps.version.outputs.version }}.zip",
            "last_updated": "$(date -u +"%Y-%m-%d %H:%M:%S")"
          }
          EOF

      - name: Upload release directory
        uses: garygrossgarten/github-action-scp@0.10.0
        with:
          local: release
          remote: /httpdocs/${{ env.PLUGIN }}
          host: ${{ secrets.PLESK_HOST }}
          username: ${{ secrets.PLESK_USER }}
          privateKey: ${{ secrets.PLESK_SSH_KEY }}
