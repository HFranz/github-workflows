name: Release

on:
  workflow_call:
    inputs:
      plugin:
        type: string
        required: true
      main_file:
        type: string
        required: false

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      PLUGIN: ${{ inputs.plugin }}
      MAIN_FILE: ${{ inputs.main_file || inputs.plugin }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Extract version from plugin
        id: version
        shell: bash
        run: |
          VERSION=$(grep -oP '^\s*\*\s*Version:\s*\K[\d.]+' "${MAIN_FILE}.php")

          if [ -z "$VERSION" ]; then
            echo "❌ Version not found in ${MAIN_FILE}.php"
            exit 1
          fi

          echo "Plugin: $PLUGIN"
          echo "Main file: $MAIN_FILE"
          echo "Version: $VERSION"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches plugin version
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" != "tag" ]; then
            echo "❌ This workflow must be triggered by a tag push (got ref_type: ${{ github.ref_type }})."
            exit 1
          fi

          TAG="${{ github.ref_name }}"
          VERSION="${{ steps.version.outputs.version }}"

          if [ "$TAG" != "$VERSION" ]; then
            echo "❌ Tag '${TAG}' does not match version '${VERSION}' found in ${MAIN_FILE}.php."
            exit 1
          fi

          echo "✅ Tag matches plugin version: $VERSION"

      - name: Update workflow summary
        run: |
          {
            echo "## 🚀 Release"
            echo ""
            echo "- Plugin: **${PLUGIN}**"
            echo "- Main file: **${MAIN_FILE}.php**"
            echo "- Version: **${{ steps.version.outputs.version }}**"
            echo "- Triggered by: @${{ github.actor }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Download Plugin ZIP Artifact for this commit
        uses: dawidd6/action-download-artifact@v27
        with:
          workflow: main.yml
          name: plugin-zip
          path: artifacts
          commit: ${{ github.sha }}
          workflow_conclusion: success

      - name: Prepare release ZIP
        shell: bash
        run: |
          mkdir -p release

          ZIP=$(find artifacts -name "*.zip" -type f | head -n1)

          if [ -z "$ZIP" ]; then
            echo "❌ No ZIP artifact found."
            exit 1
          fi

          mv "$ZIP" "release/${{ steps.version.outputs.version }}.zip"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            gh release upload \
              "${{ steps.version.outputs.version }}" \
              "release/${{ steps.version.outputs.version }}.zip" \
              --clobber
          else
            gh release create \
              "${{ steps.version.outputs.version }}" \
              "release/${{ steps.version.outputs.version }}.zip" \
              --latest \
              --verify-tag \
              --generate-notes
          fi

      - name: Generate update.json
        shell: bash
        run: |
          cat > release/update.json <<EOF
          {
            "version": "${{ steps.version.outputs.version }}",
            "slug": "${PLUGIN}",
            "package": "https://${{ secrets.PLESK_HOST }}/${PLUGIN}/${{ steps.version.outputs.version }}.zip",
            "last_updated": "$(date -u +"%Y-%m-%d %H:%M:%S")"
          }
          EOF

      - name: Upload release directory
        uses: garygrossgarten/github-action-scp@0.10.0
        with:
          local: release
          remote: /httpdocs/${{ env.PLUGIN }}
          host: ${{ secrets.PLESK_HOST }}
          username: ${{ secrets.PLESK_USER }}
          privateKey: ${{ secrets.PLESK_SSH_KEY }}
