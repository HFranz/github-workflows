name: Release Node App

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        required: false
        default: "22"
      dist-dir:
        type: string
        required: false
        default: "dist"
      run-tests:
        type: boolean
        required: false
        default: true

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json version
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" != "tag" ]; then
            echo "❌ This workflow must be triggered by a tag push (got ref_type: ${{ github.ref_type }})."
            exit 1
          fi

          TAG="${{ github.ref_name }}"
          VERSION="v$(node -p "require('./package.json').version")"

          if [ "$TAG" != "$VERSION" ]; then
            echo "❌ Tag '${TAG}' does not match package.json version '${VERSION}'."
            exit 1
          fi

          echo "✅ Tag matches package.json version: $VERSION"

      - name: Lint
        if: ${{ inputs.run-tests }}
        run: npm run lint

      - name: Test
        if: ${{ inputs.run-tests }}
        run: npm test

      - name: Build
        run: npm run build

      - name: Package build output
        shell: bash
        run: |
          cd "${{ inputs.dist-dir }}"
          zip -r "../${{ github.event.repository.name }}-${{ github.ref_name }}.zip" .

      - name: Update workflow summary
        run: |
          {
            echo "## 🚀 Release"
            echo ""
            echo "- Repo: **${{ github.repository }}**"
            echo "- Tag: **${{ github.ref_name }}**"
            echo "- Triggered by: @${{ github.actor }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create \
            "${{ github.ref_name }}" \
            "${{ github.event.repository.name }}-${{ github.ref_name }}.zip" \
            --latest \
            --verify-tag \
            --generate-notes
